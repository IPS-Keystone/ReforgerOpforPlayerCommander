<?xml version="1.0" encoding="UTF-8"?>
<!--
	Opfor Player Commander - Fog of War toolbar icon, ON state.
	Exactly the eye from the OFF icon, lifted to make room for fog banks rolling across its lower lid,
	so the two states read as one pair. White on transparent so the editor UI can tint it.
	Source for OPC_FogOfWar_On.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
	<defs>
		<!-- Knock the eye out around each bank so the fog reads as sitting in front of it -->
		<mask id="fogGap" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
			<rect x="0" y="0" width="128" height="128" fill="#ffffff"/>
			<rect x="-2" y="71" width="132" height="23" rx="11.5" fill="#000000"/>
			<rect x="14" y="90" width="100" height="23" rx="11.5" fill="#000000"/>
		</mask>
	</defs>

	<g mask="url(#fogGap)">
		<path d="M18 46 Q64 -1 110 46 Q64 93 18 46 Z"
			fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="64" cy="46" r="15" fill="#ffffff"/>
	</g>

	<g fill="#ffffff">
		<rect x="4" y="76" width="120" height="13" rx="6.5"/>
		<rect x="20" y="95" width="88" height="13" rx="6.5"/>
	</g>
</svg>
